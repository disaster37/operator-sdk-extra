version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "gomod"
    directory: "/ci/dagger"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gomod"
    directory: "/samples/elasticsearch-operator"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/samples/memcached-operator"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/samples/ingress-sentinel-operator"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/.opencode"
    schedule:
      interval: "weekly"
